# Build Docker image and push to GHCR

name: Build and Push Docker Image to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0); leave empty to use current UTC timestamp (vYYYYMMDD-HHMMSS)'
        required: false
        type: string

jobs:
  prepare:
    name: Resolve tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            if [ -z "$INPUT_TAG" ]; then
              TAG="v$(date -u +%Y%m%d-%H%M%S)"
            else
              TAG="$INPUT_TAG"
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Write VERSION
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "$TAG" > internal/build/VERSION
          echo "Building tag: $TAG for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/axonhub

      - name: Build & push single-arch to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/axonhub:${{ env.TAG }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository_owner }}/axonhub:latest-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create_manifests:
    name: Create multi-arch manifests (GHCR)
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (GHCR - version)
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/axonhub:${TAG} \
            ghcr.io/${{ github.repository_owner }}/axonhub:${TAG}-amd64 \
            ghcr.io/${{ github.repository_owner }}/axonhub:${TAG}-arm64

      - name: Create & push manifest (GHCR - latest)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/axonhub:latest \
            ghcr.io/${{ github.repository_owner }}/axonhub:latest-amd64 \
            ghcr.io/${{ github.repository_owner }}/axonhub:latest-arm64
